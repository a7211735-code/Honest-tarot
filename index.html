<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>誠實的塔羅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
/* VOICE: 安靜、溫柔、不迴避——像一位會說實話的朋友
   IDEA: 一張深酒紅絲絨牌桌，牌攤開在桌上等你選
   PICTURE: 桌面本身：空牌位 + 扇形牌堆，翻開後是象牙色牌面
   COLOUR and TYPE: 酒紅絲絨、象牙牌面、一點金；Noto Serif TC 標題 + Noto Sans TC 內文
   LAYOUT: 小標題 → 牌桌（設定、牌位、牌堆）→ 解讀清單 → 總結 */
:root{color-scheme:dark;--bg:#220b15;--felt:#3a1225;--felt2:#4b1830;--ink:#f3e8dc;--mute:#cdb7ad;--gold:#d8b56e;--rose:#f0a3b1;--ivory:#f7f0e3;--line:rgba(216,181,110,.28)}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Noto Sans TC",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Noto Serif TC",serif;font-weight:700;line-height:1.15;margin:0;text-wrap:balance}
.band{padding:clamp(28px,4vw,56px) max(5vw,16px)}
.wrap{max-width:1180px;margin:0 auto}
header.band{padding-bottom:18px}
h1{font-size:clamp(32px,5vw,48px);color:var(--ink)}
.lede{color:var(--mute);max-width:36em;margin:12px 0 0}
.table{background:radial-gradient(ellipse at 50% 30%,var(--felt2),var(--felt) 55%,#2a0d1b);border-block:1px solid var(--line)}
.controls{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,.8fr);gap:18px 28px;align-items:start}
label.q span,.lab{display:block;font-size:14px;color:var(--mute);margin-bottom:6px}
textarea{width:100%;font:16px/1.5 inherit;font-family:inherit;color:var(--ink);background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical}
textarea:focus,button:focus-visible,input:focus-visible+span{outline:2px solid var(--gold);outline-offset:2px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{min-height:44px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);font:15px inherit;font-family:inherit;cursor:pointer}
.pill[aria-pressed=true]{background:var(--gold);color:#2a0d1b;border-color:var(--gold);font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-top:12px}
.tog{display:flex;align-items:center;gap:8px;min-height:44px;cursor:pointer;color:var(--mute);font-size:15px}
.tog input{width:20px;height:20px;accent-color:var(--gold)}
.btn{min-height:44px;padding:8px 18px;border-radius:10px;border:1px solid var(--gold);background:transparent;color:var(--gold);font:15px inherit;font-family:inherit;cursor:pointer}
.btn.solid{background:var(--gold);color:#2a0d1b;font-weight:500}
.btn:hover{filter:brightness(1.1)}
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(12px,3vw,32px);margin:34px 0 10px}
.slot{width:clamp(100px,21vw,170px);text-align:center}
.slot .pos{font-size:14px;color:var(--mute);margin-top:8px}
.slot .nm{font-family:"Noto Serif TC",serif;font-size:15px;color:var(--ink);min-height:1.4em}
.card{aspect-ratio:100/160;perspective:900px;width:100%}
.inner{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.card.open .inner{transform:rotateY(180deg)}
.side{position:absolute;inset:0;backface-visibility:hidden;border-radius:8px;overflow:hidden;box-shadow:0 8px 22px rgba(0,0,0,.45)}
.side svg{width:100%;height:100%;display:block}
.face{transform:rotateY(180deg)}
.empty{position:absolute;inset:0;border:1.5px dashed var(--line);border-radius:8px}
.status{text-align:center;color:var(--gold);font-size:15px;margin:22px 0 10px}
.fanbox{position:relative}
.fan{display:flex;overflow-x:auto;padding:26px 24px 18px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.fan button{flex:none;width:66px;aspect-ratio:100/160;margin-left:-44px;padding:0;border:0;background:none;cursor:pointer;border-radius:7px;transition:transform .2s,opacity .3s}
.fan button:first-child{margin-left:0}
.fan button svg{width:100%;height:100%;display:block;border-radius:7px;box-shadow:-3px 4px 10px rgba(0,0,0,.4)}
.fan button:hover,.fan button:focus-visible{transform:translateY(-14px)}
.fan button.taken{opacity:0;pointer-events:none}
.fan.done button{opacity:.25;pointer-events:none}
.fanbox .nav{display:flex;justify-content:center;gap:10px}
.shuf .fan button{animation:jig .5s ease}
@keyframes jig{40%{transform:translate(var(--dx),var(--dy)) rotate(var(--dr))}}
#reading{display:none}
#reading.on{display:block}
.qecho{color:var(--mute);margin:0 0 22px}
.qecho b{color:var(--ink);font-weight:500}
.list{display:grid;gap:18px}
.item{display:grid;grid-template-columns:120px minmax(0,1fr);gap:18px;padding:20px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.025)}
.item .th{width:120px;aspect-ratio:100/160;border-radius:7px;overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.item .th svg{width:100%;height:100%;display:block}
.item .p{font-size:14px;color:var(--gold)}
.item h3{font-size:24px;margin:2px 0 4px}
.item h3 small{font:500 14px "Noto Sans TC",sans-serif;color:var(--rose);margin-left:8px}
.kw{font-size:14px;color:var(--mute);margin:0 0 10px}
.tt{font-size:14px;font-weight:500;color:var(--ink);margin:12px 0 2px}
.tt.l{color:var(--gold)}
.item p{margin:0;max-width:40em}
.answer{padding:22px 24px;border-radius:14px;background:var(--felt);border:1px solid var(--line);margin-bottom:22px}
.answer h3{font-size:22px;margin-bottom:8px;color:var(--gold)}.answer p{margin:0 0 8px;max-width:44em}.answer .lead{font-size:18px;line-height:1.65;color:var(--ink)}
.flow{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px 16px;margin:16px 0;padding:14px 0;border-block:1px solid var(--line)}
.flow dt{color:var(--gold);font-size:15px}.flow dd{margin:0}.flow dd b{font-weight:500;color:var(--ink)}
.answer h4{font:700 17px "Noto Serif TC",serif;color:var(--gold);margin:6px 0 8px}
.answer .open{color:var(--mute);font-size:16px;margin-bottom:12px}
.steps{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:10px}
.steps li{display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:12px;align-items:baseline}
.when{font-size:14px;color:#2a0d1b;background:var(--gold);border-radius:999px;padding:2px 10px;text-align:center;white-space:nowrap}
.close{margin-top:16px;padding:16px 18px;border-radius:12px;background:var(--ivory);color:#3a1422;font-family:"Noto Serif TC",serif;font-size:17px;line-height:1.7}
@media(max-width:600px){.steps li{grid-template-columns:minmax(0,1fr);gap:4px}.when{justify-self:start}}
@media(max-width:600px){.flow{grid-template-columns:minmax(0,1fr);gap:2px}.flow dd{margin-bottom:8px}}
.answer .note{font-size:14px;color:var(--mute)}
.ai{padding:22px 24px;border-radius:14px;border:1px dashed var(--gold);margin-bottom:26px}
.aihead{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}.aihead h3{font-size:20px}.aihead p{margin:4px 0 0;color:var(--mute);font-size:15px}
#aiout:not(:empty){margin-top:18px;border-top:1px solid var(--line);padding-top:16px}
#aiout h4{font:700 17px "Noto Serif TC",serif;color:var(--gold);margin:16px 0 6px}#aiout h4:first-child{margin-top:0}#aiout p{margin:0 0 8px;max-width:44em}#aiout .wait{color:var(--mute)}
.lens{font-size:14px;color:var(--mute);border-left:2px solid var(--gold);padding-left:10px;margin:0 0 4px!important}
.ask{margin-top:14px;padding:10px 14px;border-radius:10px;background:rgba(216,181,110,.12);color:var(--ink);font-size:15px}
.sum .q2{color:#6b2440;font-style:normal;border-top:1px solid #e2d3bd;padding-top:10px}
.sum{margin-top:28px;padding:24px;border-radius:14px;background:var(--ivory);color:#2c1520}
.sum h2{font-size:28px;color:#4b1830;margin-bottom:10px}
.sum p{margin:0 0 10px;max-width:42em}
.sum .last{font-weight:500;color:#6b2440}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
footer{color:var(--mute);font-size:14px;border-top:1px solid var(--line)}
footer p{max-width:44em;margin:0 0 6px}
.owner{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line);color:var(--ink)}.owner b{color:var(--gold);font-weight:500}
#copied{color:var(--gold);font-size:14px;align-self:center}
@media(max-width:980px){.controls{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.controls label.q{grid-column:1/-1}}@media(max-width:600px){.controls{grid-template-columns:minmax(0,1fr)}}
@media(max-width:520px){.item{grid-template-columns:72px minmax(0,1fr);gap:14px;padding:16px}.item .th{width:72px}.item h3{font-size:21px}.slot{width:clamp(84px,27vw,120px)}}
@media(prefers-reduced-motion:reduce){.inner,.fan button{transition:none}.shuf .fan button{animation:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs><linearGradient id="g-dawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9d8ea"/><stop offset="1" stop-color="#ffe2b8"/></linearGradient><linearGradient id="g-day" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fb8e4"/><stop offset="1" stop-color="#d8eff7"/></linearGradient><linearGradient id="g-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5c66a"/><stop offset="1" stop-color="#fbe9bd"/></linearGradient><linearGradient id="g-night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141a44"/><stop offset="1" stop-color="#3c3f86"/></linearGradient><linearGradient id="g-dusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b2858"/><stop offset="1" stop-color="#f08a68"/></linearGradient><linearGradient id="g-storm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#56606f"/><stop offset="1" stop-color="#aab4be"/></linearGradient><linearGradient id="g-red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a33a36"/><stop offset="1" stop-color="#e68a55"/></linearGradient><linearGradient id="g-grey" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7f8492"/><stop offset="1" stop-color="#c7cad2"/></linearGradient><linearGradient id="g-sunset" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ee7f45"/><stop offset="1" stop-color="#fbd48c"/></linearGradient><linearGradient id="g-sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd0e2"/><stop offset="1" stop-color="#eef8f5"/></linearGradient><linearGradient id="g-green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6dc9c"/><stop offset="1" stop-color="#e8f1c6"/></linearGradient><linearGradient id="g-black" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#120e16"/><stop offset="1" stop-color="#2c2233"/></linearGradient><linearGradient id="g-tensw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#262b3d"/><stop offset=".62" stop-color="#3a3f55"/><stop offset=".74" stop-color="#f5c66a"/></linearGradient><clipPath id="artclip"><rect x="10" y="10" width="180" height="262" rx="6"/></clipPath>

      <rect width="100" height="160" rx="7" fill="#5a1c37"/>

<header class="band"><div class="wrap">
  <h1>誠實的塔羅</h1>
  <p class="lede">靜下心想一個問題，憑直覺從牌堆裡選牌。每張牌會先說實話，不粉飾；再留一盞燈，告訴你接下來能做什麼。</p>
</div></header>

<main>
<section class="band table"><div class="wrap">
  <div class="controls">
    <label class="q"><span>你想問的事（可留白）</span>
      <textarea id="q" rows="2" placeholder="例如：這份工作我該繼續撐下去嗎？"></textarea>
    </label>
    <div>
      <span class="lab">牌陣</span>
      <div class="pills" id="spreads"></div>
    </div>
    <div>
      <span class="lab">想看的面向</span>
      <div class="pills" id="topics"></div>
    </div>
  </div>
  <div class="row">
    <label class="tog"><input type="checkbox" id="rev" checked><span>包含逆位</span></label>
    <button class="btn" id="shuffle">重新洗牌</button>
  </div>

  <div class="slots" id="slots"></div>
  <p class="status" id="status" aria-live="polite"></p>
  <div class="fanbox">
    <div class="fan" id="fan" aria-label="牌堆"></div>
    <div class="nav"><button class="btn" id="prev" aria-label="牌堆往左">‹ 往左</button><button class="btn" id="next" aria-label="牌堆往右">往右 ›</button></div>
  </div>
</div></section>

<section class="band" id="reading"><div class="wrap">
  <h2 style="font-size:clamp(28px,4vw,40px);margin-bottom:14px">牌在說什麼</h2>
  <p class="qecho" id="qecho"></p>
  <div class="answer" id="answer"></div>
  <div class="ai" id="aibox" hidden>
    <div class="aihead"><div><h3>請 Claude 針對你的問題細讀</h3><p>把你的問題和這次的牌一起交給 Claude，寫一份只屬於這次提問的解讀。</p></div>
    <button class="btn solid" id="askai">開始細讀</button></div>
    <div id="aiout" aria-live="polite"></div>
  </div>
  <div class="list" id="list"></div>
  <div class="sum" id="sum"></div>
  <div class="acts">
    <button class="btn solid" id="again">再抽一次</button>
    <button class="btn" id="copy">複製這次的解讀</button>
    <span id="copied" aria-live="polite"></span>
  </div>
</div></section>
</main>

<footer class="band"><div class="wrap">
  <p>塔羅是幫你整理思緒、和自己對話的工具，不是命定的預言。牌面無法取代醫療、法律、財務或心理專業的意見。</p>
  <p>如果你正在經歷很難熬的時刻，請找信任的人或專業協助聊聊，你不需要一個人扛。</p>
  <div class="owner">
    <p>我不是靠塔羅維生，興趣之餘做了這個，不要拿去做商業用途🙏</p>
    <p>此網頁歸 <b>yucc_1023</b> 擁有</p>
  </div>
</div></footer>

<script>
{
// 名|英|關鍵字|正位實話|正位的燈|逆位實話|逆位的燈 （名前加 ! 表示較沉重的牌）
const RAW=`愚者|The Fool|新開始、冒險、天真|你正站在起點，心裡想跳，但路其實還沒看清楚。勇氣是真的，風險也是真的。|先跨出一小步就好，不用一次賭上全部，允許自己邊走邊學。|逆位時，可能是衝動大過判斷，也可能是害怕到遲遲不敢開始，兩者都會讓你原地打轉。|問自己：最壞的情況我承受得起嗎？可以，就去；不行，先準備一半。
魔術師|The Magician|行動力、資源、表達|你手上其實有足夠的工具，差的是開始用。能力不是問題，執行才是。|把想法寫成今天就能做的第一步，然後做完它。|逆位提醒：可能有人話說得漂亮卻做不到，也可能是你自己在包裝、在拖延。|回到具體：哪件事你說了很久卻還沒做？從那件開始。
女祭司|The High Priestess|直覺、靜默、未明之事|答案還沒浮出水面，現在逼問也問不到。有些事你還不知道，有些你其實知道、只是不想承認。|安靜下來聽自己的感覺，它比你以為的準。|逆位時，你可能忽略了直覺，或有人沒把話說清楚，模糊讓你不安。|把心裡隱約覺得不對的地方寫下來，它值得被認真看待。
皇后|The Empress|滋養、豐盛、照顧|這是讓事情慢慢長大的時期。關係、作品或身體，都需要耐心灌溉，急不來。|好好照顧自己，就是讓一切繼續生長的土壤。|逆位時，你可能把照顧都給了別人，自己卻乾掉了；或保護得太多，讓對方喘不過氣。|今天先做一件只為自己好的事，不需要理由。
皇帝|The Emperor|秩序、責任、界線|現在需要的是結構和規則，不是情緒。該做決定的人，要扛起來。|定一個清楚的計畫和界線，穩定感會跟著回來。|逆位時，可能控制欲太強，也可能缺乏紀律、沒人負責，權力的問題正在拉扯。|分清楚哪些是你能控制的，力氣只花在那裡。
教皇|The Hierophant|傳統、學習、指引|照著既有的方法、向有經驗的人請教，會比自己摸索更有效率。|找一位你信任的前輩或老師，問一個具體的問題。|逆位時，你可能在質疑規則，或覺得被體制、被別人的期待綁住。|你可以不照別人的劇本走，但要先寫清楚自己的版本。
戀人|The Lovers|選擇、連結、價值一致|這張牌不只關於愛，更關於選擇。你面前有一個需要用真心回答的決定。|選那個讓你更像自己的選項，而不只是比較安全的那個。|逆位時，關係或價值觀可能不一致，或是你在逃避做選擇。|誠實說出你真正想要的，即使它會讓某些事改變。
戰車|The Chariot|意志、推進、方向|你可以前進，但前提是把互相拉扯的力量拉回同一個方向。|定一個清楚的目標，然後專注，不要每天換方向。|逆位時，方向失控或被太多事分心，很用力卻沒有前進。|先停下來，選一件最重要的事，其他的暫時放下。
力量|Strength|溫柔的勇氣、耐心、自制|真正的力量不是硬撐，而是能溫和地面對自己的恐懼和脾氣。你比你以為的有韌性。|用耐心代替對抗，事情會慢慢軟化。|逆位時，你可能沒什麼自信，或是情緒壓過了理智。|對自己說話溫柔一點，你不需要現在就完美。

// ---------- court cards ----------
function court(suit,rank){
  const c=SC[suit],obj=OBJ[suit];let s=BG[suit]();
  if(rank===11){s+=fig({x:100,y:92,h:156,robe:c,under:'#f4f1ea',arms:'hold',hat:c});s+=obj(fig.r[0]+4,fig.r[1]-(suit==='cups'||suit==='pentacles'?14:0),suit==='cups'||suit==='pentacles'?1.1:1.15)}
  if(rank===12){s+=horse(98,214,1.3,HC[suit]);s+=fig({x:92,y:122,h:92,robe:'#a9b0b9',sleeve:c,under:c,arms:'hold',helm:c});s+=obj(fig.r[0]+4,fig.r[1]-(suit==='cups'||suit==='pentacles'?14:2),suit==='cups'||suit==='pentacles'?1:1.1)}
  if(rank===13){s+=throne(100,88,96,164,'#b8bcc6');s+=fig({x:100,y:84,h:168,robe:c,under:'#f4f1ea',arms:'hold',crown:true,long:'#c77b3a',hair:'#c77b3a'});s+=obj(fig.r[0]+2,fig.r[1]-(suit==='cups'||suit==='pentacles'?14:0),suit==='cups'||suit==='pentacles'?1.05:1.1)}
  if(rank===14){s+=throne(100,82,104,170,'#9aa0a8');s+=fig({x:100,y:80,h:172,robe:c,cape:'#00000030',under:'#2b2733',arms:'hold',crown:true,beard:'#7a5a3a'});s+=obj(fig.r[0]+2,fig.r[1]-(suit==='cups'||suit==='pentacles'?14:0),suit==='cups'||suit==='pentacles'?1.05:1.1)}
  return s;
}
function scene(c){
  if(c.i<22)return MAJ[c.i]();
  return c.rank>10?court(c.suit,c.rank):MIN[c.suit][c.rank-1]();
}

function face(c,rev){
  const top=c.i<22?ROMAN[c.i]:(c.rank===1?'A':c.rank>10?'':ROMAN[c.rank]);
  return `<svg viewBox="0 0 200 320" role="img" aria-label="${c.name}${rev?'（逆位）':''}"><g${rev?' transform="rotate(180 100 160)"':''}>
  <rect width="200" height="320" rx="12" fill="#f7f0e3"/>
  <g clip-path="url(#artclip)">${scene(c)}</g>
  <rect x="10" y="10" width="180" height="262" rx="6" fill="none" stroke="#c99a45" stroke-width="2"/>
  ${top?`<rect x="80" y="4" width="40" height="20" rx="4" fill="#f7f0e3" stroke="#c99a45" stroke-width="1.5"/><text x="100" y="19" text-anchor="middle" font-size="12" fill="#6b2440" font-family="Noto Serif TC,serif">${top}</text>`:''}
  <text x="100" y="296" text-anchor="middle" font-size="17" fill="#3a1422" font-family="Noto Serif TC,serif" font-weight="700">${c.name}</text>
  <text x="100" y="311" text-anchor="middle" font-size="9" fill="#8a6a5a" font-family="Georgia,serif" letter-spacing=".5">${c.en.toUpperCase()}</text></g></svg>`;
}
const BACK='<svg viewBox="0 0 100 160" preserveAspectRatio="none" aria-hidden="true"><use href="#cb"/></svg>';

// ---- state ----
const $=id=>document.getElementById(id);
let st={spread:'ppf',topic:'all',rev:true,deck:[],picks:[],busy:false};
try{const s=JSON.parse(localStorage.getItem('tarot-set')||'{}');if(SPREADS[s.spread])st.spread=s.spread;if(typeof s.rev==='boolean')st.rev=s.rev;if(['all','love','work'].includes(s.topic))st.topic=s.topic}catch(e){}
$('rev').checked=st.rev;
const save=()=>{try{localStorage.setItem('tarot-set',JSON.stringify({spread:st.spread,rev:st.rev,topic:st.topic}))}catch(e){}};

function shuffleDeck(){const d=CARDS.map(c=>c.i);for(let k=d.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[d[k],d[j]]=[d[j],d[k]]}return d}

function renderSpreads(){
  $('spreads').innerHTML=Object.entries(SPREADS).map(([k,v])=>`<button class="pill" data-s="${k}" aria-pressed="${k===st.spread}">${v.label}</button>`).join('');
}
function renderTopics(){
  $('topics').innerHTML=[['all','綜合'],['love','感情'],['work','工作與金錢']].map(([k,v])=>`<button class="pill" data-t="${k}" aria-pressed="${k===st.topic}">${v}</button>`).join('');
}
function renderSlots(){
  $('slots').innerHTML=SPREADS[st.spread].pos.map((p,k)=>`<div class="slot"><div class="card" id="c${k}"><div class="empty"></div></div><div class="pos">${p}</div><div class="nm" id="n${k}"></div></div>`).join('');
}
function renderFan(){
  $('fan').classList.remove('done');
  $('fan').innerHTML=st.deck.map((id,k)=>`<button data-k="${k}" aria-label="第 ${k+1} 張牌" style="--dx:${(Math.random()*30-15).toFixed(0)}px;--dy:${(Math.random()*-24).toFixed(0)}px;--dr:${(Math.random()*16-8).toFixed(0)}deg">${BACK}</button>`).join('');
}
function status(){
  const n=SPREADS[st.spread].pos.length,p=st.picks.length;
  $('status').textContent=p<n?`憑直覺從下方牌堆選 ${n} 張（已選 ${p}）`:'翻牌中……';
}
function reset(anim){
  st.deck=shuffleDeck();st.picks=[];st.busy=false;if(aiCtl)aiCtl.abort();aiCtl=null;aiText='';$('aiout').textContent='';$('askai').disabled=false;$('askai').textContent='開始細讀';
  renderSpreads();renderTopics();renderSlots();renderFan();status();
  $('reading').classList.remove('on');
  $('fan').scrollLeft=Math.max(0,($('fan').scrollWidth-$('fan').clientWidth)/2);
  if(anim){const t=document.querySelector('.table');t.classList.remove('shuf');void t.offsetWidth;t.classList.add('shuf')}
}

function pick(k){
  const n=SPREADS[st.spread].pos.length;
  if(st.busy||st.picks.length>=n)return;
  const btn=$('fan').querySelector(`[data-k="${k}"]`);if(!btn||btn.classList.contains('taken'))return;
  btn.classList.add('taken');
  const c=CARDS[st.deck[k]],rev=st.rev&&Math.random()<.5,slot=st.picks.length;
  st.picks.push({c,rev});
  $('c'+slot).innerHTML=`<div class="inner"><div class="side">${BACK}</div><div class="side face">${face(c,rev)}</div></div>`;
  status();
  if(st.picks.length===n){st.busy=true;$('fan').classList.add('done');reveal(0)}
}
function reveal(k){
  if(k>=st.picks.length){$('status').textContent='牌都翻開了，往下看解讀。';showReading();return}
  const p=st.picks[k];$('c'+k).classList.add('open');
  $('n'+k).textContent=p.c.name+(p.rev?'・逆位':'');
  setTimeout(()=>reveal(k+1),matchMedia('(prefers-reduced-motion:reduce)').matches?80:620);
}

const LENS={'給你的指引':'這張牌是此刻最想對你說的話。','過去':'已經發生、到現在仍在影響你的事。','現在':'你此刻真正身處的狀態。','未來':'照目前的方向走下去，最可能的發展。它不是定局，現在的選擇會改變它。','現況':'事情目前真實的樣子。','阻礙':'卡住你的地方。就算是張好牌，落在這裡也代表「太多了」或「被忽略了」。','建議':'你可以採取的態度或行動。','你':'你在這段關係裡的狀態和心情。','對方':'對方目前的狀態。這是牌面的映照，不是讀心，請當成參考。','關係現況':'你們之間此刻的樣子。','挑戰':'這段關係需要一起面對的課題。'};
const NUM={1:'開始與種子',2:'選擇與平衡',3:'成長與表達',4:'穩定與停駐',5:'變動與摩擦',6:'和諧與修復',7:'考驗與評估',8:'推進與力量',9:'接近完成',10:'結束與新的循環'};
const SUITM={wands:'行動、熱情和工作上的推進',cups:'感情、關係和內心的感受',swords:'想法、溝通，以及需要面對的衝突或真相',pentacles:'金錢、身體和現實生活的安排'};
const tx=p=>({t:p.rev?p.c.rv:p.c.up,l:p.rev?p.c.rvL:p.c.upL,lv:p.rev?p.c.lvR:p.c.lv,wk:p.rev?p.c.wkR:p.c.wk});
const isBright=p=>BRIGHT.has(p.c.i)&&!p.rev;
const isHard=p=>p.c.heavy&&!p.rev;
function summary(){
  const P=st.picks,n=P.length,out=[],pos=SPREADS[st.spread].pos;
  const maj=P.filter(p=>p.c.i<22).length,rv=P.filter(p=>p.rev).length;
  // 故事線
  if(st.spread==='ppf'){
    const [a,b,c]=P;let t=`從「${a.c.name}」走到「${b.c.name}」，接著是「${c.c.name}」。`;
    if((isHard(a)||a.rev)&&!isHard(c)&&!c.rev)t+='整體趨勢是往上的：過去的重量正在鬆開，未來那張牌比較輕。';
    else if(isHard(c)||c.c.heavy)t+='未來那張牌比較沉。我不想粉飾：照現在的方向走，可能會碰到困難。但「未來」是可以改的，現在那張牌就是你的施力點。';
    else if(c.rev)t+='未來那張是逆位，代表事情可能會卡一下或延後，不代表不會發生。';
    else t+='未來的方向大致順著現在的努力延伸下去。';
    out.push(t);
  }else if(st.spread==='choice'){
    const [a,b,c]=P;out.push(`現況是「${a.c.name}」，卡住你的是「${b.c.name}${b.rev?'（逆位）':''}」。${isBright(b)?'阻礙位出現明亮的牌，常常表示問題不在外面，而是你還不敢相信、或還沒接住眼前的好事。':'把阻礙看清楚，就已經解決了一半。'}建議牌「${c.c.name}」給的具體做法是：${doOf(c,effTopic(analyze($('q').value.trim())))}`);
  }else if(st.spread==='love'){
    const [a,b]=P,sa=a.c.suit,sb=b.c.suit;let t=`你是「${a.c.name}」，對方是「${b.c.name}」。`;
    if(a.rev!==b.rev)t+='一正一逆：你們現在的狀態不太同步，一個在往外、一個在往內收，容易誤會彼此的意思。';
    else if(a.rev&&b.rev)t+='兩張都是逆位：你們可能都有點累、有點防衛。先照顧好自己的狀態，再談關係會比較順。';
    else t+='兩張都是正位：彼此的能量是打開的，有機會好好溝通。';
    if(sa&&sb&&sa===sb)t+=`兩張都是${SUITNAME[sa]}，你們在意的東西很接近。`;
    out.push(t);
  }
  if(n===1)out.push(maj?'這次抽到大阿爾克那，表示這個問題連著你人生裡比較大的課題，值得認真看待。':`這是一張${SUITNAME[P[0].c.suit]}牌，重點落在${SUITM[P[0].c.suit]}，是日常裡具體可以處理的事情。`);
  else if(maj/n>=.5)out.push(`${n} 張裡有 ${maj} 張大阿爾克那：這件事牽動的不只是一時的狀況，而是你人生裡比較大的課題，答案可能需要時間慢慢長出來。`);
  if(n>1){
    const cnt={};P.forEach(p=>{if(p.c.suit)cnt[p.c.suit]=(cnt[p.c.suit]||0)+1});
    const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
    if(top&&top[1]>=2)out.push(`${SUITNAME[top[0]]}出現了 ${top[1]} 張，重心在${SUITM[top[0]]}。`);
    const ranks={};P.forEach(p=>{if(p.c.rank&&p.c.rank<=10)ranks[p.c.rank]=(ranks[p.c.rank]||0)+1});
    Object.entries(ranks).filter(([,v])=>v>=2).forEach(([k])=>out.push(`數字 ${k} 重複出現，主題是「${NUM[k]}」。`));
    const courts=P.filter(p=>p.c.rank>10).length;
    if(courts)out.push(`有 ${courts} 張宮廷牌。宮廷牌常常代表真實的人，也可能是你現在需要拿出來的某種態度。`);
    if(rv>=Math.ceil(n*.6))out.push('多數牌是逆位：能量有點卡住，或是往內收了。這不代表結局不好，而是現在用力的方向可能需要調整，或是你需要先休息。');
    else if(rv===0&&st.rev)out.push('全部都是正位：能量相對順暢，事情的發展比較直接。');
  }
  const hv=P.filter(p=>p.c.heavy).map(p=>p.c.name);
  if(hv.length)out.push(`這次出現了比較沉的牌（${hv.join('、')}）。我不會把它說成好消息，它指出的困難是真的。但沉重的牌通常是在告訴你哪裡需要處理，而不是替你宣判結果。`);
  const br=P.filter(isBright).map(p=>p.c.name);
  if(br.length)out.push(`牌面裡也有明亮的訊號（${br.join('、')}），你可以允許自己期待。`);
  const last=P[n-1];
  const kk=keyCard();return {lines:out,last:doOf(kk,effTopic(analyze($('q').value.trim()))),ask:kk.c.ask};
}

const POS=new Set([1,3,4,6,7,8,10,14,17,19,20,21,22,24,25,27,29,36,37,38,41,44,45,50,55,64,66,69,71,72,73]);
function val(p){const i=p.c.i;if(p.c.heavy)return p.rev?.3:-2;if(POS.has(i))return p.rev?-.5:(BRIGHT.has(i)?2:1.5);return p.rev?-.7:.3}
function analyze(q){
  const r={yn:false,choice:false,when:false,how:false,topic:null};if(!q)return r;
  r.choice=/還是|哪一個|哪個|二選一|選哪/.test(q);
  r.when=/什麼時候|何時|多久|幾月|今年|明年/.test(q);
  r.how=/怎麼|如何|怎樣|該做什麼|要做什麼/.test(q);
  r.yn=!r.choice&&/會不會|能不能|可不可以|是否|要不要|該不該|有沒有|嗎/.test(q);
  if(/感情|喜歡|曖昧|男友|女友|男朋友|女朋友|對象|復合|交往|結婚|另一半|前任|伴侶|老公|老婆|告白|戀|桃花|分手/.test(q))r.topic='love';
  else if(/工作|職|老闆|主管|同事|面試|升遷|創業|事業|案子|客戶|離職|轉職|考試|學業|升學|錢|財|投資|收入|薪|生意|業績/.test(q))r.topic='work';
  return r;
}
function keyCard(){const P=st.picks;return st.spread==='choice'?P[2]:P[P.length-1]}
const doOf=(p,t)=>p.rev?p.c.doR:t==='love'?p.c.doL:t==='work'?p.c.doW:p.c.doG;
const infoOf=(p,t)=>{const x=tx(p);return t==='love'?x.lv:t==='work'?x.wk:x.t.replace(/^逆位時，/,'')};
const LEAD={'給你的指引':'給你的提醒','過去':'過去留下的影響','現在':'你現在的狀況','未來':'照這樣走下去','現況':'你現在的狀況','阻礙':'真正卡住你的','建議':'牌建議的方向','你':'你這邊','對方':'對方那邊','關係現況':'你們之間現在','挑戰':'需要一起面對的','建議 ':'建議'};
function effTopic(an){return st.topic!=='all'?st.topic:(an.topic||'all')}
// returns {head, lines[], flow[[label,text]], steps[]}
function answerFor(q,a){
  const P=st.picks,pos=SPREADS[st.spread].pos,k=keyCard(),t=effTopic(a),out=[];
  const score=P.reduce((s,p)=>s+val(p),0)/P.length;
  const worst=P.slice().sort((x,y)=>val(x)-val(y))[0];
  const domain=t==='love'?'感情上':t==='work'?'在收入和工作上':'';
  // 1. 直接回答
  if(!q){out.push(`你沒有寫下問題，那就把這次的牌當成給現在的你的提醒。最值得馬上做的一件事是：${doOf(k,t)}`)}
  else if(a.yn){
    if(score>=.8)out.push(`直接說：牌面偏向「是」，而且訊號算清楚。`);
    else if(score>=.2)out.push(`直接說：偏向「是」，但有條件。條件就是下面那幾個步驟，做到了，機會會大很多。`);
    else if(score>-.4)out.push(`直接說：牌沒有給出明確的是或否。結果還沒定，關鍵在你接下來怎麼做。`);
    else out.push(`直接說：牌面偏向「不」，至少是「不是現在、也不是用現在的方式」。這不是叫你放棄，而是要先處理「${worst.c.name}」點出的問題。`);
  }else if(a.choice){
    out.push(`牌不會替你選，但這次的牌整體${score>=.2?'偏順，代表你心裡其實已經有傾向，可以相信它':score>-.4?'有好有難，兩條路都有代價要付':'偏沉，無論選哪邊，現在的狀態都需要先被照顧'}。想看得更清楚，可以把兩個選項分開，各抽一次比較。`);
  }else if(a.when){
    const fast=P.some(p=>p.c.suit==='wands'||p.c.i===29||p.c.i===10),slow=P.filter(p=>p.c.suit==='pentacles'||p.c.i===12||p.c.i===9).length;
    out.push(`老實說，塔羅不擅長報日期，我不想亂給你一個時間。${fast&&!slow?'但牌面的節奏偏快，事情有在動，可能比你想的早。':slow?'牌面的節奏偏慢，這件事需要時間累積，急不來。':'比起等時間，你先做了什麼更重要。'}`);
  }else{
    out.push(`最直接的答案：${doOf(k,t)}`);
    out.push(score>=.2?`整體牌面是支持你的，照這個方向做，${domain||'事情'}會慢慢有起色。`:`但老實說，過程不會太輕鬆，最需要先處理的是「${worst.c.name}${worst.rev?'・逆位':''}」點出的問題：${infoOf(worst,t)}`);
  }
  // 2. 依位置說清楚
  const flow=P.map((p,i)=>[LEAD[pos[i]]||pos[i],`${p.c.name}${p.rev?'・逆位':''}`,infoOf(p,t)]);
  // 3. 具體步驟：建議牌 → 阻礙/最難的牌 → 其他
  const order=[k,worst,...P].filter((p,i,arr)=>arr.indexOf(p)===i);
  // 開場：先接住提問的人
  let open;
  if(!q)open='沒有特定問題也沒關係。有時候我們只是需要被提醒一下，現在最該照顧的是什麼。';
  else if(/收入|錢|薪|財|存款|賺|負債|債/.test(q))open='想讓收入多一點，背後常常不只是數字，而是想要多一點安全感、多一點選擇的空間。這個想法很實際，也值得認真對待。';
  else if(/前任|復合|放不下|分手/.test(q))open='放不下一個人，不代表你軟弱。想把事情看清楚，其實是在照顧自己。';
  else if(a.topic==='love')open='感情最難的地方，是我們只能決定自己的那一半。你願意停下來問，已經是在好好對待這段關係，也好好對待自己。';
  else if(a.topic==='work')open='工作佔了生活很大一塊。會想問清楚，代表你很在意自己走的方向，這份在意本身就很珍貴。';
  else if(a.choice)open='卡在兩個選項之間很累，因為選了一個，就代表要放掉另一個。先別急，我們一起看看。';
  else open='謝謝你願意把心裡的事拿出來問。下面我會先說實話，再陪你想接下來能做什麼。';
  // 依時間分的步驟：今天（最小）→ 這週（處理卡點）→ 這個月（建議方向）
  const others=order.filter(p=>p!==k&&p!==worst);
  const steps=[['今天','花五分鐘，誠實回答這個問題：'+worst.c.ask+'寫下來就好，不用給別人看。']];
  if(worst!==k)steps.push(['這週',doOf(worst,t)]);
  steps.push([worst!==k?'這個月':'這週',doOf(k,t)]);
  others.slice(0,2).forEach(p=>steps.push(['也可以試試',doOf(p,t)]));
  // 照顧自己
  const heavy=P.some(p=>p.c.heavy);
  const care=heavy?'這段時間可能比較辛苦。記得吃好、睡飽，別把所有事都往自己身上扛。如果壓力大到影響睡眠或生活，找信任的人或專業的人聊聊，這不是軟弱，是聰明。'
    :t==='work'?'想多賺一點的時候，很容易把自己逼太緊。記得留一點時間休息，累垮了，反而走不遠。'
    :t==='love'?'在關係裡，也別忘了你自己的需要。好好吃飯、和朋友聊聊，讓自己的生活不只有這一個人。'
    :'不管結果如何，先照顧好自己的身體和心情，這是做其他所有事的基礎。';
  // 最後想對你說
  const close=score>=.8?'牌面是站在你這邊的。不用等到百分之百確定才開始，往前走就好，你比你以為的更準備好了。'
    :score>=.2?'這條路不會完全沒有阻力，但方向是對的。一步一步來，你會開始看到變化。'
    :score>-.4?'現在的局面有好有難，結果還握在你手上。不用一次想通全部，先把今天那一件做完。'
    :'這次的牌不輕鬆，我不想騙你說一切都會很順利。但困難被看見，就有機會被處理。你不需要一次解決全部，先做完今天那一件就好。你已經在找出路了。';
  return {head:q?'針對你的問題':'給此刻的你',open,lines:out,flow,steps,care,close,t};
}
function showReading(){
  const q=$('q').value.trim(),pos=SPREADS[st.spread].pos,an=analyze(q),tp=st.topic;
  const qe=$('qecho');qe.textContent='';
  if(q){qe.append('你的問題：');const b=document.createElement('b');b.textContent=q;qe.append(b)}
  else qe.textContent='沒有寫下問題也沒關係，牌會回應你此刻心裡最在意的事。';
  const A=answerFor(q,an),ans=$('answer');ans.textContent='';
  const mk=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e};
  ans.append(mk('h3','',A.head));ans.append(mk('p','open',A.open));A.lines.forEach(t=>ans.append(mk('p','lead',t)));
  const fl=mk('dl','flow');A.flow.forEach(([l,c,t])=>{const dd=mk('dd','');dd.append(mk('b','',c+'　'),t);fl.append(mk('dt','',l),dd)});ans.append(fl);
  ans.append(mk('h4','',A.t==='work'?'具體可以這樣做（收入與工作）':A.t==='love'?'具體可以這樣做（感情）':'具體可以這樣做'));
  const ol=mk('ul','steps');A.steps.forEach(([w,t])=>{const li=mk('li','');li.append(mk('span','when',w),mk('span','',t));ol.append(li)});ans.append(ol);
  ans.append(mk('h4','','記得照顧自己'));ans.append(mk('p','',A.care));
  ans.append(mk('div','close',A.close));
  if(st.topic==='all'&&an.topic)ans.append(mk('p','note',`看起來你問的是${an.topic==='love'?'感情':'工作與金錢'}，上面的步驟已經針對這個面向。`));
  $('aibox').hidden=!aiSample;
  $('list').innerHTML=st.picks.map((p,k)=>{const c=p.c,t=tx(p);return `<article class="item">
    <div class="th">${face(c,p.rev)}</div>
    <div><div class="p">${pos[k]}</div><h3>${c.name}<small>${p.rev?'逆位':'正位'}</small></h3>
    <p class="kw">${c.en}・${c.kw}</p>
    <p class="lens">${LENS[pos[k]]||''}</p>
    <div class="tt">實話</div><p>${t.t}</p>
    ${tp!=='work'?`<div class="tt">在感情上</div><p>${t.lv}</p>`:''}
    ${tp!=='love'?`<div class="tt">在工作與金錢上</div><p>${t.wk}</p>`:''}
    <div class="tt l">留一盞燈</div><p>${t.l}</p>
    <div class="tt l">具體可以做</div><p>${doOf(p,effTopic(an))}</p>
    <div class="ask">問問自己：${c.ask}</div></div></article>`}).join('');
  const s=summary();
  $('sum').innerHTML=`<h2>整體來看</h2>${s.lines.map(l=>`<p>${l}</p>`).join('')}<p class="last">如果只帶走一件事：${s.last}</p><p class="q2">今晚可以想一想：${s.ask}</p>`;
  $('reading').classList.add('on');$('copied').textContent='';
  setTimeout(()=>$('reading').scrollIntoView({behavior:'smooth',block:'start'}),300);
}

function plain(){
  const q=$('q').value.trim(),pos=SPREADS[st.spread].pos,s=summary(),tp=st.topic;
  let t=`【誠實的塔羅】${SPREADS[st.spread].label}\n`+(q?`問題：${q}\n`:'')+'\n'+(A=>A.open+'\n\n'+A.lines.join('\n')+'\n\n'+A.flow.map(([l,c,x])=>`${l}（${c}）：${x}`).join('\n')+'\n\n具體可以這樣做：\n'+A.steps.map(([w,s])=>`・${w}：${s}`).join('\n')+'\n\n記得照顧自己：'+A.care+'\n\n最後想對你說：'+A.close)(answerFor(q,analyze(q)))+'\n\n'+(aiText?`【Claude 的細讀】\n${aiText}\n\n`:'');
  st.picks.forEach((p,k)=>{const x=tx(p);t+=`${pos[k]}｜${p.c.name}（${p.rev?'逆位':'正位'}）\n實話：${x.t}\n`+(tp!=='work'?`感情：${x.lv}\n`:'')+(tp!=='love'?`工作與金錢：${x.wk}\n`:'')+`留一盞燈：${x.l}\n具體可以做：${doOf(p,effTopic(analyze(q)))}\n問問自己：${p.c.ask}\n\n`});
  return t+'整體來看：\n'+s.lines.join('\n')+`\n如果只帶走一件事：${s.last}`;
}

// ---- Claude 細讀 ----
let aiSample=null,aiCtl=null,aiText='';
function renderAI(text){
  const box=$('aiout');box.textContent='';
  text.split('\n').map(s=>s.trim()).filter(Boolean).forEach(line=>{
    const m=line.match(/^【(.+?)】\s*(.*)$/);
    if(m){const h=document.createElement('h4');h.textContent=m[1];box.append(h);if(m[2]){const p=document.createElement('p');p.textContent=m[2];box.append(p)}}
    else{const p=document.createElement('p');p.textContent=line.replace(/^[#*\-\s]+/,'');box.append(p)}
  });
}
function buildPrompt(){
  const q=$('q').value.trim(),pos=SPREADS[st.spread].pos;
  const cards=st.picks.map((p,k)=>{const t=tx(p);return `位置：${pos[k]}（${LENS[pos[k]]||''}）\n牌：${p.c.name} ${p.c.en}（${p.rev?'逆位':'正位'}）\n關鍵字：${p.c.kw}\n牌義：${t.t}\n感情：${t.lv}\n工作與金錢：${t.wk}\n建議：${t.l}\n具體做法：${doOf(p,effTopic(analyze(q)))}`}).join('\n\n');
  return `你是一位溫柔、但說實話的塔羅解讀者。請用繁體中文（台灣用語），用第二人稱「你」，像朋友坐在對面那樣說話，不要像在背課本。

原則：
- 直接回應這個人的問題，把每張牌連回他的處境，不要只重複牌義。可以引用問題裡的字眼。
- 要具體、可以馬上做：多用動詞、時間和例子（例如「這週」「列出三項」「先試一個月」），少用「能量」「課題」這類抽象詞。讀完的人應該知道明天要做什麼。
- 牌面不樂觀時要實話實說，不粉飾、不假裝沒事；但也不宣判、不恐嚇。指出困難的同時，給一條實際可行的路。
- 如果是「會不會／要不要／是否」這類問題，誠實說出牌面偏向（偏是、偏否或不明朗）和理由，也說明什麼條件可能改變結果。
- 塔羅是自我對話的工具，不是命定預言。不要給精確日期，不要假裝知道第三人真正的想法。
- 涉及健康、法律、投資等，不做確定判斷，溫和建議找專業的人。
- 如果問題透露出很深的絕望或傷害自己的念頭，先放下解牌，真誠關心他，鼓勵他現在就聯絡信任的人或專業協助（台灣安心專線 1925，24 小時），不要做預言式的解讀。

輸出格式：純文字，不要用 Markdown 符號（不要 #、*、-）。依序使用以下小標，小標各自獨立一行：
【直接回答你】2 到 4 句
【牌怎麼說】每張牌一段，段首寫「位置・牌名（正位／逆位）：」，用 2 到 3 句把它連到問題
【實話】一段，說出最需要面對的事
【你可以做的】2 到 3 個具體的小行動，每個一行，行首用「・」
【留給你的一句話】一句
總長大約 450 到 650 字。

提問者的問題：${q||'（沒有寫下問題。請把這次的牌當成給此刻的他的整體提醒，並在開頭溫和說明這一點。）'}
牌陣：${SPREADS[st.spread].label}
是否包含逆位：${st.rev?'是':'否'}

這次抽到的牌：
${cards}`;
}
async function askAI(){
  if(!aiSample||!st.picks.length)return;
  const btn=$('askai');btn.disabled=true;btn.textContent='細讀中…';
  $('aiout').innerHTML='<p class="wait">Claude 正在看你的牌……</p>';
  aiCtl=new AbortController();const ctl=aiCtl;
  try{
    const r=await aiSample(buildPrompt(),{signal:ctl.signal,cache:false,onText:({text})=>{if(ctl===aiCtl&&text&&text!=='Thinking...'){aiText=text;renderAI(text)}}});
    if(ctl!==aiCtl)return;
    aiText=r.text;renderAI(r.text);btn.textContent='重新細讀';
  }catch(e){
    if(ctl!==aiCtl)return;
    const msg=e&&e.code==='not_granted'?'這個頁面目前沒有取得呼叫 Claude 的權限，先參考上方的解讀就好。':e&&e.code==='rate_limited'?'現在請求有點多，過一兩分鐘再按一次。':'這次細讀沒有成功，可以稍後再試一次。';
    $('aiout').textContent='';const p=document.createElement('p');p.className='wait';p.textContent=msg;$('aiout').append(p);
    if(e&&e.code==='not_granted')$('aibox').hidden=true;
    btn.textContent='再試一次';
  }finally{if(ctl===aiCtl)btn.disabled=false}
}
$('askai').addEventListener('click',askAI);
if(window.claude&&window.claude.use)window.claude.use('sample').then(s=>{aiSample=s;if($('reading').classList.contains('on'))$('aibox').hidden=!s}).catch(()=>{});

// ---- events ----
$('topics').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b)return;st.topic=b.dataset.t;save();renderTopics();if($('reading').classList.contains('on'))showReading()});
$('spreads').addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(!b)return;st.spread=b.dataset.s;save();reset(false)});
$('rev').addEventListener('change',e=>{st.rev=e.target.checked;save();reset(false)});
$('shuffle').addEventListener('click',()=>reset(true));
$('again').addEventListener('click',()=>{reset(true);document.querySelector('.table').scrollIntoView({behavior:'smooth'})});
$('fan').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b)pick(+b.dataset.k)});
$('prev').addEventListener('click',()=>$('fan').scrollBy({left:-$('fan').clientWidth*.7,behavior:'smooth'}));
$('next').addEventListener('click',()=>$('fan').scrollBy({left:$('fan').clientWidth*.7,behavior:'smooth'}));
$('fan').addEventListener('keydown',e=>{if(e.key==='ArrowLeft')$('prev').click();if(e.key==='ArrowRight')$('next').click()});
$('copy').addEventListener('click',()=>{
  const t=plain();
  navigator.clipboard.writeText(t).then(()=>{$('copied').textContent='已複製'}).catch(()=>{
    const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();
    try{document.execCommand('copy');$('copied').textContent='已複製'}catch(e){$('copied').textContent='無法自動複製，請手動選取文字'}a.remove();
  });
});
reset(false);
}
